<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The id is what `vscode-icon` looks up so it can re-inject this stylesheet
      into its own shadow root. The real panels get the same link from
      `codiconLink` in src/vscode/panel.ts; without it every icon is an empty box.
    -->
    <link
      rel="stylesheet"
      id="vscode-codicon-stylesheet"
      href="/codicon.css"
    />
    <title>Flight Plan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
