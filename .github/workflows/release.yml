name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Stage the npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main."
            exit 1
          fi

      - name: Check the tag matches the version in package.json
        run: |
          version_tag="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$version_tag" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match package.json, which is at $version_tag."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.9.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the npm version that stages publishes
        run: |
          npm ci --prefix .github/release-npm --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/release-npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Lint, type-check and test
        run: nx run-many -t eslint:lint typecheck test

      - name: Build the npm package
        run: nx run backend:package

      - name: Stage the package on npm
        working-directory: dist/package
        run: npm stage publish --provenance
